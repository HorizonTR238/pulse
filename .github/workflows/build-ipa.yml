name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bundle-ID auf eigene aendern
        run: |
          grep -rl "net.dehlwes.pulse" . --exclude-dir=.git \
            | xargs sed -i '' 's/net\.dehlwes\.pulse/de.sebastian.pulse/g'
      - name: Build (unsigniert)
        run: |
          xcodebuild -project Pulse.xcodeproj -scheme Pulse \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" build
      - name: IPA packen
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Pulse.app Payload/
          zip -r Pulse.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-ipa
          path: Pulse.ipa
